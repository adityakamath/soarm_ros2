# Shared between so100 and so101 (same STS servo bus, same defaults on both arms).
serial_port: /dev/ttySERVO
baud_rate: 1000000
use_mock: false
use_sync_write: true

arm_operating_mode: 0
gripper_operating_mode: 0

shoulder_pan_motor_id: 1
shoulder_lift_motor_id: 2
elbow_flex_motor_id: 3
wrist_flex_motor_id: 4
wrist_roll_motor_id: 5
gripper_motor_id: 6

p_coefficient: 14
d_coefficient: 24
i_coefficient: 0

deadband: 10
