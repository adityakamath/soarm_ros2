# Shared between so100 and so101 (same STS servo bus, same defaults on both arms).
serial_port: /dev/ttySERVO
baud_rate: 1000000
use_mock: false
use_sync_write: true

arm_operating_mode: 0
gripper_operating_mode: 0

shoulder_pan_motor_id: 1
shoulder_lift_motor_id: 2
elbow_flex_motor_id: 3
wrist_flex_motor_id: 4
wrist_roll_motor_id: 5
gripper_motor_id: 6

# Per-joint PID (Mode 0) - must be tuned per motor, not shared system-wide (different joints
# carry different loads). Start all six from the same values, then tune independently.
shoulder_pan_p_coefficient: 14
shoulder_pan_d_coefficient: 24
shoulder_pan_i_coefficient: 0

shoulder_lift_p_coefficient: 14
shoulder_lift_d_coefficient: 24
shoulder_lift_i_coefficient: 0

elbow_flex_p_coefficient: 14
elbow_flex_d_coefficient: 24
elbow_flex_i_coefficient: 0

wrist_flex_p_coefficient: 14
wrist_flex_d_coefficient: 24
wrist_flex_i_coefficient: 0

wrist_roll_p_coefficient: 14
wrist_roll_d_coefficient: 24
wrist_roll_i_coefficient: 0

gripper_p_coefficient: 14
gripper_d_coefficient: 24
gripper_i_coefficient: 0

deadband: 10
